syntax = "proto3";

package glum;

import "google/protobuf/timestamp.proto";

enum Priority {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
}

message Todo {
  string id = 1;
  string title = 2;
  bool completed = 3;
  Priority priority = 4;
  optional google.protobuf.Timestamp due_date = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool can_write = 8;
  bool owner = 9;
  bool calendar_sync_enabled = 10;
  string calendar_sync_status = 11;
  string calendar_sync_error = 12;
  string google_calendar_event_id = 13;
  string google_calendar_event_link = 14;
  bool due_has_time = 15;
}

message CreateTodoRequest {
  string title = 1;
  Priority priority = 2;
  optional google.protobuf.Timestamp due_date = 3;
  bool sync_to_calendar = 4;
  bool due_has_time = 5;
}

message GetTodoRequest {
  string id = 1;
}

message UpdateTodoRequest {
  string id = 1;
  string title = 2;
  Priority priority = 3;
  optional google.protobuf.Timestamp due_date = 4;
  bool due_has_time = 5;
}

message ToggleTodoRequest {
  string id = 1;
}

message DeleteTodoRequest {
  string id = 1;
}

message DeleteTodoResponse {
  bool success = 1;
}

message ShareTodoRequest {
  string id = 1;
  string user_id = 2;
  bool can_write = 3;
}

message UnshareTodoRequest {
  string id = 1;
  string user_id = 2;
}

message ShareTodoResponse {
  bool success = 1;
}

message SetTodoCalendarSyncRequest {
  string id = 1;
  bool sync_enabled = 2;
}

message ListTodosRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListTodosResponse {
  repeated Todo todos = 1;
}

service Todos {
  rpc CreateTodo(CreateTodoRequest) returns (Todo);
  rpc GetTodo(GetTodoRequest) returns (Todo);
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (Todo);
  rpc ToggleTodo(ToggleTodoRequest) returns (Todo);
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
  rpc ShareTodo(ShareTodoRequest) returns (ShareTodoResponse);
  rpc UnshareTodo(UnshareTodoRequest) returns (ShareTodoResponse);
  rpc SetTodoCalendarSync(SetTodoCalendarSyncRequest) returns (Todo);
}
