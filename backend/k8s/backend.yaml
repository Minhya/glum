apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: glum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: glum-backend:latest    # your Docker image
        imagePullPolicy: IfNotPresent # use local image in kind
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: url
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: glum
spec:
  selector:
    app: backend
  ports:
  - port: 3000