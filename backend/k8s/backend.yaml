apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: glum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: glum-backend:latest    # your Docker image
        imagePullPolicy: IfNotPresent # use local image in kind
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: url
        - name: APP_JWT_SECRET
          value: dev-only-change-me-at-deploy-time
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google-oauth-secret
              key: client-id
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google-oauth-secret
              key: client-secret
              optional: true
        - name: GOOGLE_REDIRECT_URI
          value: http://localhost:4000/auth/google/callback
        - name: WEB_URL
          value: http://localhost:4000/
        ports:
        - containerPort: 3000
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: glum
spec:
  selector:
    app: backend
  ports:
  - port: 3000
    name: grpc
    targetPort: 3000
  - port: 3001
    name: auth
    targetPort: 3001
