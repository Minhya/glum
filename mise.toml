[tasks.build]
description = "Build the Rust backend"
run = "cargo build --manifest-path backend/Cargo.toml"

[tasks."proto:web"]
description = "Generate web DTOs and gRPC-Web clients from protobufs"
run = "buf generate backend/protobufs --template backend/protobufs/buf.gen.yaml"

[tasks.migrate]
description = "Run SQLx migrations"
run = "sqlx migrate run --database-url postgres://glum:changeme@localhost:5432/glum --source backend/migrations"

[tasks."cluster:up"]
description = "Create kind cluster and apply k8s manifests"
run = """
kind create cluster --name glum
kubectl apply -f backend/k8s/namespace.yaml
kubectl apply -f backend/k8s/
"""

[tasks."cluster:down"]
description = "Tear down the kind cluster"
run = "kind delete cluster --name glum"

[tasks."cluster:status"]
description = "Show status of all pods in the glum namespace"
run = "kubectl get all -n glum"

[tasks.dev]
description = "Port-forward postgres and run the backend locally"
run = """
kubectl port-forward -n glum svc/postgres 5432:5432 &
DATABASE_URL=postgres://glum:changeme@localhost:5432/glum cargo run --manifest-path backend/Cargo.toml
"""

[tasks."test:forward"]
description = "Port-forward all services for local access"
run = """
kubectl port-forward -n glum svc/web 4000:80 &
kubectl port-forward -n glum svc/envoy 8090:8090 &
kubectl port-forward -n glum svc/postgres 5432:5432 &
echo "Web:      http://localhost:4000"
echo "Auth/API: http://localhost:8090"
echo "Postgres: localhost:5432"
"""

[tasks."db:notes"]
description = "Show all notes in the database"
run = "kubectl exec -n glum -it $(kubectl get pod -n glum -l app=postgres -o jsonpath='{.items[0].metadata.name}') -- psql -U glum -d glum -c 'SELECT * FROM notes;'"

[tasks."db:todos"]
description = "Show all todos in the database"
run = "kubectl exec -n glum -it $(kubectl get pod -n glum -l app=postgres -o jsonpath='{.items[0].metadata.name}') -- psql -U glum -d glum -c 'SELECT * FROM todos;'"

[tasks."load-image"]
description = "Build backend Docker image and load it into kind"
run = """
docker build -t glum-backend:latest backend/
kind load docker-image glum-backend:latest --name glum
kubectl rollout restart deployment/backend -n glum
"""

[tasks."load-web"]
description = "Build web Docker image and load it into kind"
run = """
docker build -t glum-web:latest web/
kind load docker-image glum-web:latest --name glum
kubectl rollout restart deployment/web -n glum
"""
