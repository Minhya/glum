name: Docker Images

on:
  push:
    branches:
      - main
      - backend
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: glum-backend
            context: backend
          - name: web
            image: glum-web
            context: web
          - name: envoy
            image: glum-envoy
            context: deploy/envoy
          - name: caddy
            image: glum-caddy
            context: deploy/caddy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/minhya/${{ matrix.image }}:latest
            ghcr.io/minhya/${{ matrix.image }}:${{ github.sha }}
