services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glum
      POSTGRES_USER: glum
      POSTGRES_PASSWORD: glum-internal-postgres
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glum -d glum"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/minhya/glum-backend:latest}
    pull_policy: always
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: glum
      PGUSER: glum
      PGPASSWORD: glum-internal-postgres
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-change-me-at-deploy-time}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GLUM_PUBLIC_URL:-http://localhost:4000}/auth/google/callback
      WEB_URL: ${GLUM_PUBLIC_URL:-http://localhost:4000}/
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  envoy:
    image: ${ENVOY_IMAGE:-ghcr.io/minhya/glum-envoy:latest}
    pull_policy: always
    command: ["-c", "/etc/envoy/envoy.yaml"]
    depends_on:
      - backend
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/minhya/glum-web:latest}
    pull_policy: always
    ports:
      - "${WEB_PORT:-4000}:80"
    depends_on:
      - envoy
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/minhya/glum-caddy:latest}
    pull_policy: always
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      GLUM_HOST: ${GLUM_HOST:-glum-app.duckdns.org}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data-v2:
  caddy-data:
  caddy-config:
