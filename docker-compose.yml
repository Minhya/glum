services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glum
      POSTGRES_USER: glum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glum -d glum"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/minhya/glum-backend:latest}
    pull_policy: always
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: glum
      PGUSER: glum
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-change-me-at-deploy-time}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GLUM_PUBLIC_URL:-http://localhost:4000}/auth/google/callback
      WEB_URL: ${GLUM_PUBLIC_URL:-http://localhost:4000}/
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.29-latest
    command:
      - sh
      - -c
      - |
        cat >/tmp/envoy.yaml <<'EOF'
        static_resources:
          listeners:
          - name: listener_0
            address:
              socket_address:
                address: 0.0.0.0
                port_value: 8090
            filter_chains:
            - filters:
              - name: envoy.filters.network.http_connection_manager
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  codec_type: auto
                  stat_prefix: ingress_http
                  route_config:
                    name: local_route
                    virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                      - match:
                          prefix: "/auth/"
                        route:
                          cluster: auth_service
                          timeout: 30s
                      - match:
                          prefix: "/"
                        route:
                          cluster: backend_service
                          timeout: 0s
                          max_stream_duration:
                            grpc_timeout_header_max: 0s
                      cors:
                        allow_origin_string_match:
                        - prefix: "*"
                        allow_methods: GET, PUT, DELETE, POST, OPTIONS
                        allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization
                        expose_headers: custom-header-1,grpc-status,grpc-message
                  http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          clusters:
          - name: auth_service
            connect_timeout: 0.25s
            type: logical_dns
            lb_policy: round_robin
            load_assignment:
              cluster_name: auth_service
              endpoints:
              - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: backend
                        port_value: 3001
          - name: backend_service
            connect_timeout: 0.25s
            type: logical_dns
            http2_protocol_options: {}
            lb_policy: round_robin
            load_assignment:
              cluster_name: backend_service
              endpoints:
              - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: backend
                        port_value: 3000
        EOF
        envoy -c /tmp/envoy.yaml
    depends_on:
      - backend
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/minhya/glum-web:latest}
    pull_policy: always
    ports:
      - "${WEB_PORT:-4000}:80"
    depends_on:
      - envoy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${GLUM_PUBLIC_URL:-https://glum-app.duckdns.org:8443}
      - --to
      - web:80
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      GLUM_HOST: ${GLUM_HOST:-glum-app.duckdns.org}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
